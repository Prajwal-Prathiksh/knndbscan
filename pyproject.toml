[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "knndbscan"
version = "0.2.0"
description = "kNN-DBSCAN: density-based clustering of kNN graphs, with a parallel C++ core"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["clustering", "dbscan", "knn", "density-based", "openmp", "mpi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# kNN search on NVIDIA GPUs (CUDA 12). Clustering itself always runs on the CPU.
gpu = [
    "cupy-cuda12x>=13.6",
    "cuml-cu12>=25.10 ; sys_platform == 'linux'",
]

[project.urls]
Source = "https://github.com/Prajwal-Prathiksh/knndbscan"
Upstream = "https://github.com/ut-padas/knndbscan"
Paper = "https://arxiv.org/abs/2009.04552"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "clang-format==21.1.8",
    "mypy>=1.18",
    "ruff>=0.13",
]
examples = [
    "matplotlib>=3.7",
]
dev = [
    "cmake>=3.26",
    "ninja>=1.11",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "examples" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The library is loaded with ctypes and links no Python, so the wheel is py3-none-<platform>.
wheel.py-api = "py3"
sdist.exclude = [".github/"]

[tool.cibuildwheel]
# The wheel is py3-none-<platform>, so one interpreter builds it for every Python;
# CI then tests the Linux wheel on each supported version (`make test-dist`).
build = "cp312-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
# Apple Clang has no OpenMP runtime; delocate bundles Homebrew's libomp into the wheel,
# whose deployment target must not be older than the one libomp was built for: the
# macOS version of the CI runner (macos-15 in .github/workflows/ci.yml).
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", OpenMP_ROOT = "$(brew --prefix libomp)" }

[tool.uv]
# Rebuild the C library on `uv sync` / `uv run` when its sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*" },
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "PIE", "T20", "UP", "NPY", "SIM"]
ignore = [
    "E501", # line length is the formatter's job
    "N803", # X for data matrices, as in scikit-learn
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
files = ["src/knndbscan"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "cupy.*", "cuml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "gpu: needs CuPy, cuML and a CUDA device (skipped otherwise)",
    "cli: runs the MPI command-line program given by KNNDBSCAN_CLI (skipped otherwise)",
]

[tool.coverage.run]
source = ["knndbscan"]
