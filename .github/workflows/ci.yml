name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  checks:
    name: Lint and test (editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make coverage

  cli:
    name: MPI command-line program on 1-3 ranks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --locked
      - run: make test-cli

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Builds in a manylinux_2_28 container (Linux) and tests each wheel after repair.
      - run: uvx --from "cibuildwheel>=3,<4" cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  python-versions:
    name: Wheel on Python ${{ matrix.python }} (${{ matrix.resolution }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: dist
      - run: make test-dist PYTHONS=${{ matrix.python }} RESOLUTIONS=${{ matrix.resolution }}

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: [checks, cli, wheels, sdist, python-versions]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: the index must list this repository, workflow and environment.
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
