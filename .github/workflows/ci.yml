name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Action versions: majors where the action publishes moving major tags; setup-uv
# publishes only full-version tags, so it is pinned exactly, as is cibuildwheel (run via uvx).
jobs:
  checks:
    name: Lint and test (editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make lint
      - run: make coverage

  cli:
    name: MPI command-line program on 1-3 ranks
    runs-on: ubuntu-latest
    env:
      # Hosted runners have fewer physical cores than the test's 3 ranks, and Open MPI
      # refuses to oversubscribe by default (OMPI_ for Open MPI 4, PRTE_ for 5).
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --locked
      - run: make test-cli

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS wheels are built natively per architecture (Homebrew's libomp is
        # single-architecture) on the oldest supported macOS, which must match
        # MACOSX_DEPLOYMENT_TARGET in [tool.cibuildwheel.macos]; macos-latest-os checks
        # them on the newest macOS.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Builds in a manylinux_2_28 container (Linux) and tests each wheel after repair.
      - run: uvx cibuildwheel==4.3.5 --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  macos-latest-os:
    name: macOS wheel on ${{ matrix.runner }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26 # Apple Silicon
            wheel: wheel-macos-15
          - runner: macos-26-intel
            wheel: wheel-macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel }}
          path: dist
      - run: make test-dist PYTHONS="3.10 3.15"

  python-versions:
    name: Wheel on Python ${{ matrix.python }} (${{ matrix.resolution }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: dist
      - run: make test-dist PYTHONS=${{ matrix.python }} RESOLUTIONS=${{ matrix.resolution }}

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: [checks, cli, wheels, macos-latest-os, sdist, python-versions]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: the index must list this repository, workflow and environment.
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
