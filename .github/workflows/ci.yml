name: CI

# Releases (docs/RELEASING.md): pushing a v* tag tests it, uploads it to TestPyPI and
# creates its GitHub pre-release; running this workflow by hand on that tag with
# publish_to_pypi uploads it to PyPI and turns the pre-release into a release.
#
# Changes to docs/ and Markdown files alone start no run: nothing tested here reads them.
# README.md is the exception, because it is the package's description on PyPI. GitHub
# applies no path filter to tag pushes, so every release tag is still tested.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["**", "!docs/**", "!**.md", "README.md"]
  pull_request:
    paths: ["**", "!docs/**", "!**.md", "README.md"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: On a v* tag, upload to PyPI instead of TestPyPI
        type: boolean
        default: false

# A new push to a pull request cancels the run for its previous commit; runs on main and
# on tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action versions: majors where the action publishes moving major tags; setup-uv and
# msvc-dev-cmd are pinned exactly, as is cibuildwheel (run via uvx).
jobs:
  checks:
    name: Lint and test (editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make lint
      - run: make coverage
      - run: make test-cpp

  cli:
    name: MPI command-line program on 1-7 ranks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --locked
      - run: make test-cli

  sanitizers:
    name: AddressSanitizer and UBSan (C tests, library, MPI program)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --locked
      - run: make test-sanitize

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS wheels are built natively per architecture (Homebrew's libomp is
        # single-architecture). The runners' macOS version must match
        # MACOSX_DEPLOYMENT_TARGET in [tool.cibuildwheel.macos], the oldest macOS the
        # wheels support. Windows builds with clang-cl ([tool.cibuildwheel.windows]).
        os:
          [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # clang-cl and the linker find the Windows SDK and runtime libraries through it.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      # Builds in a manylinux_2_28 container (Linux) and tests each wheel after repair.
      - run: uvx cibuildwheel==4.3.5 --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # cibuildwheel tests each wheel on the Python it builds with; these test the macOS and
  # Windows wheels on the oldest and newest Pythons they support, with both dependency
  # extremes (python-versions covers every Python on Linux).
  platform-python-versions:
    name: Wheel on ${{ matrix.runner }}, Python ${{ matrix.oldest }} and 3.15
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            oldest: "3.10"
          - runner: macos-26-intel
            oldest: "3.10"
          - runner: windows-latest
            oldest: "3.10"
          # NumPy, SciPy and scikit-learn have Windows ARM64 wheels from Python 3.11 on,
          # and uv offers no Windows ARM64 Pythons to download, so setup-python installs them.
          - runner: windows-11-arm
            oldest: "3.11"
            setup-python: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - id: oldest
        if: matrix.setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.oldest }}
      - id: newest
        if: matrix.setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.runner }}
          path: dist
      - env:
          OLDEST: ${{ steps.oldest.outputs.python-path || matrix.oldest }}
          NEWEST: ${{ steps.newest.outputs.python-path || '3.15' }}
        run: |
          for python in "$OLDEST" "$NEWEST"; do
            for resolution in highest lowest-direct; do
              echo "=== Python $python, $resolution dependencies"
              .github/scripts/test_wheel.sh "$python" "$resolution"
            done
          done

  python-versions:
    name: Wheel on Python ${{ matrix.python }} (${{ matrix.resolution }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: dist
      - run: make test-dist PYTHONS=${{ matrix.python }} RESOLUTIONS=${{ matrix.resolution }}

  publish:
    name: Publish to ${{ inputs.publish_to_pypi && 'PyPI' || 'TestPyPI' }}
    needs: [checks, cli, sanitizers, wheels, platform-python-versions, sdist, python-versions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: the index must list this repository, workflow and environment.
    environment: ${{ inputs.publish_to_pypi && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish_to_pypi && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # A re-run after a partial upload must not fail on the files already there.
          skip-existing: true

  github-release:
    name: GitHub release
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      prerelease: ${{ inputs.publish_to_pypi != true }}
